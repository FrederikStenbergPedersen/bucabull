services:
    postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_DB: bucabull
            POSTGRES_USER: bucabull
            POSTGRES_PASSWORD: bucabull
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
