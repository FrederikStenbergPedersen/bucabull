; Raw CS2 demo uploads run several hundred MB — well past PHP's stock
; defaults (2M/8M). post_max_size stays a hair above upload_max_filesize
; so the extra multipart overhead (the other form fields, boundaries)
; never gets silently truncated. Matches config('demos.max_upload_kb').
upload_max_filesize = 1200M
post_max_size = 1210M
max_input_time = 1800
