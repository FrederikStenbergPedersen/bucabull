services:
  app:
    image: ghcr.io/frederikstenbergpedersen/bucabull:latest
    restart: unless-stopped
    env_file: ./.env
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      # Uploaded screenshots (grenade library). Bind mount, not a named
      # volume, so it survives redeploys and can be backed up the same way
      # as scripts/backup-postgres.sh does for the database (plain host
      # path, rsync-able) — only `app` needs this, `queue`/`scheduler`
      # never touch uploaded files. The host directory must be writable by
      # whatever user this container runs as (verify with `docker compose
      # exec app id` — a bind mount does NOT inherit the image's build-time
      # `chown www-data storage`).
      - /var/www/bucabull/storage/app/public:/app/storage/app/public
      # Uploaded demo files + their parsed JSON (private disk — never
      # served directly, only through DemoController's team-scoped
      # actions). Unlike the public mount above, `queue-demos` needs this
      # too: uploads land here via `app`, but get read/written by the
      # queue worker that actually parses them.
      - /var/www/bucabull/storage/app/private:/app/storage/app/private
    depends_on:
      - postgres

  queue:
    image: ghcr.io/frederikstenbergpedersen/bucabull:latest
    command: php artisan queue:work --tries=3
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      - postgres

  # Dedicated queue/worker for demo parsing, kept off the default `queue`
  # service so a long-running parse (the real parser lands in a later
  # slice; --timeout is already sized for it) never blocks
  # RefreshRosterStatsJob's 5-minute schedule. --tries=1: a failed parse
  # needs investigation, not a blind retry.
  queue-demos:
    image: ghcr.io/frederikstenbergpedersen/bucabull:latest
    command: php artisan queue:work --queue=demos --tries=1 --timeout=1800
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - /var/www/bucabull/storage/app/private:/app/storage/app/private
    depends_on:
      - postgres

  scheduler:
    image: ghcr.io/frederikstenbergpedersen/bucabull:latest
    command: php artisan schedule:work
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bucabull
      POSTGRES_USER: bucabull
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
